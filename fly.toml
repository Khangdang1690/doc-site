# fly.toml app configuration file generated for sqlitedeploy-docs on 2026-05-09T16:42:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sqlitedeploy-docs'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  NODE_OPTIONS = '--max-old-space-size=128'
  PORT = '4321'

[[mounts]]
  source = 'data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
