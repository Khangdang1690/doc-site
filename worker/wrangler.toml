name = "sqlitedeploy-docs"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

# ORIGIN is the public IP (or sslip.io hostname) of your Oracle Cloud VM.
# Replace before `wrangler deploy`. HTTP — TLS lives at the Cloudflare edge.
[vars]
ORIGIN = "http://YOUR_ORACLE_VM_IP"

# Sensitive: set with `wrangler secret put WORKER_SECRET` instead of putting
# it here. Generate with `openssl rand -hex 32`. The same value goes into
# /etc/caddy/Caddyfile on the VM.
# WORKER_SECRET set via wrangler secret
